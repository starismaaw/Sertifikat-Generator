name: Keep Supabase Alive

on:
  schedule:
    # Senin & Kamis, 03:00 UTC (10:00 WIB) — jarak maks 4 hari, di bawah ambang 7 hari Supabase
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+ dibutuhkan: @supabase/supabase-js v2 selalu membuat RealtimeClient
          # yang butuh native WebSocket (baru stabil di Node 22), meski script ini
          # tidak memakai fitur realtime sama sekali — lihat error di CI run pertama.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keep-supabase-alive.mjs
