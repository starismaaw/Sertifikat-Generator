name: Supabase keep-alive

# Project Supabase Free Plan dapat di-pause kalau aktivitas database terlalu
# rendah selama 7 hari (lihat https://supabase.com/docs/guides/platform/free-project-pausing).
# Workflow ini mengirim satu request GET ringan ke REST API project pada tiga
# waktu yang tersebar setiap hari. Frekuensi ini mengikuti panduan Supabase
# tentang beberapa user request per hari dan memberi margin kalau salah satu
# jadwal GitHub Actions terlambat atau terlewat.

on:
  schedule:
    # 02:17, 10:17, dan 18:17 UTC (09:17, 17:17, dan 01:17 WIB).
    # Menit sengaja tidak bulat untuk menghindari antrean jadwal populer.
    - cron: "17 2,10,18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        run: |
          # Kedua header (apikey + Authorization Bearer) wajib dikirim sesuai
          # pola resmi Supabase — apikey saja ke endpoint root /rest/v1/
          # sempat menghasilkan 401. Query ke tabel asli (bukan root) supaya
          # request-nya identik dengan pola query nyata yang didokumentasikan.
          # Tabelnya menolak anon lewat RLS, jadi hasilnya cuma [] — itu tetap
          # dihitung sebagai aktivitas API oleh Supabase, tidak masalah.
          #
          # tr -d membuang \r\n yang kadang ikut ter-copy-paste saat secret
          # diisi lewat clipboard — kalau lolos, apikey jadi tidak cocok
          # persis dan Supabase membalas 401 tanpa penjelasan lebih lanjut.
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n')"
          # Retry dibatasi agar gangguan DNS/network sementara tidak langsung
          # menggagalkan run, tetapi error akhir tetap diteruskan ke Actions.
          curl --fail --show-error --silent \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 10 \
            --max-time 30 \
            "${SUPABASE_URL}/rest/v1/silacak_pengaturan?select=kunci&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
